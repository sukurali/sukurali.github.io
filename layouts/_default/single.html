{{ define "main" }}
<article class="news" style="padding-top: 140px; padding-bottom: 100px;">
  <div class="container" style="max-width: 800px;">
    <div class="news-img" style="height: 400px; border-radius: 8px; overflow: hidden; margin-bottom: 30px;">
      <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <div class="news-meta" style="margin-bottom: 20px;">
      <span style="margin-right: 20px;"><i class="fas fa-user"></i> {{ .Params.author }}</span>
      <span style="margin-right: 20px;"><i class="fas fa-calendar"></i> {{ .Date.Format "January 2, 2006" }}</span>
      <span><i class="fas fa-comments"></i> {{ .Params.comments }} Comments</span>
    </div>
    <h1 style="font-size: 36px; color: #1a1a5e; margin-bottom: 25px; line-height: 1.3;">{{ .Title }}</h1>
    <div class="post-content" style="font-size: 16px; line-height: 1.8; color: #444;">
      {{ .Content }}
    </div>
    <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #eee;">
      <h4 style="margin-bottom: 15px; color: #1a1a5e;">Tags</h4>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        {{ range .Params.tags }}
        <span style="background: #fff5f2; color: #ff5722; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;">{{ . }}</span>
        {{ end }}
      </div>
    </div>
    <div style="margin-top: 30px;">
      <a href="{{ "/posts" | relURL }}" class="btn btn-orange"><i class="fas fa-arrow-left"></i> Back to Blog</a>
    </div>
  </div>
</article>
{{ end }}
