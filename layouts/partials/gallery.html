<section class="gallery-trust">
  <div class="container">
    <div class="gallery-grid">
      {{ range .Site.Data.gallery }}
      <div class="gallery-item">
        <img src="{{ . }}" alt="Gallery">
      </div>
      {{ end }}
    </div>
    <div class="trust-box">
      <div class="trust-box-icon"><i class="fas fa-building"></i></div>
      <h3>{{ .Site.Params.trust_title }}</h3>
    </div>
  </div>
</section>
