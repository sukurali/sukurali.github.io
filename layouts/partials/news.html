<section class="news" id="news">
  <div class="container">
    <div class="section-header">
      <span class="section-label">{{ .Site.Params.news_label }}</span>
      <h2 class="section-title">{{ .Site.Params.news_title }}</h2>
    </div>
    <div class="news-grid">
      {{ range first 3 (where .Site.RegularPages "Type" "posts") }}
      <div class="news-card">
        <div class="news-img">
          <img src="{{ .Params.image }}" alt="{{ .Title }}">
          <div class="news-date">{{ .Date.Format "02 Jan" | upper }}</div>
        </div>
        <div class="news-content">
          <div class="news-meta">
            <span><i class="fas fa-user"></i> {{ .Params.author }}</span>
            <span><i class="fas fa-comments"></i> {{ .Params.comments }} Comments</span>
          </div>
          <h3>{{ .Title }}</h3>
          <a href="{{ .RelPermalink }}" class="read-more">Read More <i class="fas fa-arrow-right"></i></a>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
