<section class="services" id="services">
  <div class="container">
    <div class="section-header">
      <span class="section-label">{{ .Site.Params.services_label }}</span>
      <h2 class="section-title">{{ .Site.Params.services_title }}</h2>
    </div>
    <div class="services-grid">
      {{ range .Site.Data.services }}
      <div class="service-card">
        <div class="service-icon"><i class="fas fa-{{ .icon }}"></i></div>
        <h3>{{ .title }}</h3>
      </div>
      {{ end }}
    </div>
  </div>
</section>
